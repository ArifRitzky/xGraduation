<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Client Photo Proofing</title>
  <link rel="icon" href="assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="dashboard-style.css">
  <style>
    /* Kept small and self-contained on purpose - a 404 page shouldn't depend
       on a big split-screen layout (login-style.css) that assumes form fields
       and a photo panel that don't exist here. */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .not-found {
      max-width: 26rem;
    }
    .not-found img {
      height: 2rem;
      margin-bottom: 1.5rem;
    }
    .not-found .code {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gray-400);
      margin-bottom: 0.5rem;
    }
    .not-found h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .not-found p {
      color: var(--gray-600);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="not-found">
    <img src="assets/logo-full.png" alt="xGraduation logo">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist, or the link may be outdated.</p>
    <a href="dashboard.html" class="btn-primary" style="display:inline-block; text-decoration:none; padding:0.6rem 1.25rem; border-radius:0.375rem;">Go to Dashboard</a>
  </div>
</body>
</html>
